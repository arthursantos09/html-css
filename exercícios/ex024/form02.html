<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on">
        <h1>Teste de formulário</h1>
        <p>
            <label for="iuser">Usuário:</label> 
            <input type="text" name="user" id="iuser" autocomplete="username" required minlength="5" maxlength="13" size="14" placeholder="Nome do usuário">
        </p>
        <p>
            <label for="isen">Senha:</label> 
            <input type="password" name="sen" id="isen" autocomplete="current-password" required minlength="7" maxlength="20" size="14" placeholder="mínimo 7 letras">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
