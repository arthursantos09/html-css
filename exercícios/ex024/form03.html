<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" autocomplete="on" method="post">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" autocomplete="name" required placeholder="Nome completo">
        </p>
        <p>
            <label for="imed">Média:</label>
            <input type="number" name="med" id="imed" required max="20" min="0" step="0.1" placeholder="0 a 20">
        </p>
        <p>
            <label for="iper">Período:</label>
            <input type="month" name="per" id="iper" value="2024-12">
        </p>
        <p>
            <label for="idia">Dia:</label>
            <input type="date" name="dia" id="idia" value="2024-12-21">
        </p>
        <p>
            <label for="ihora">Horário:</label>
            <input type="time" name="hora" id="ihora">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        <p>
            oii tt tt uu
        </p>
    </form>
</body>
</html>
